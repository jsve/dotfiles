# Incus first-time setup for the clanker boxes, applied by `just flowdora clanker-host-setup`
# (incus admin init --preseed). Safe to re-apply, but each entry is replaced as a
# whole: settings made by hand with `incus ... set` are lost, so keep them all here.
#
# Nothing secret belongs here; this repo is public.

networks:
  # Private NAT bridge for the VMs. What guests may reach is decided twice over:
  # by the ACL in incus-acl-clanker.yaml and by the host firewall in firewalld/.
  - name: clankbr0
    type: bridge
    config:
      ipv4.address: 10.83.0.1/24
      ipv4.nat: "true"
      ipv6.address: none
      # Guests use public resolvers directly, not the host's, so they cannot look
      # up names on the LAN or VPN.
      dns.nameservers: 1.1.1.1,9.9.9.9
      security.acls: clanker
      security.acls.default.egress.action: reject
      security.acls.default.ingress.action: reject

storage_pools:
  # Plain directory under /var/lib/incus. Simple, but snapshots are full copies;
  # switch to the btrfs driver if snapshots become routine.
  - name: clanker
    driver: dir

profiles:
  - name: clanker-box
    description: Sandboxed coding-agent VM
    config:
      limits.cpu: "8"
      limits.memory: 16GiB
      # The NixOS image is not signed for secure boot.
      security.secureboot: "false"
    devices:
      root:
        type: disk
        path: /
        pool: clanker
        size: 50GiB
      eth0:
        type: nic
        network: clankbr0
        # Guests using this profile cannot talk to each other, only to the host.
        security.port_isolation: "true"
        # A guest may only use the MAC and IPv4 address Incus gave it, so it cannot
        # impersonate another guest to the host and capture its traffic.
        security.ipv4_filtering: "true"
