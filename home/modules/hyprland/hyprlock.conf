# hyprlock - Hyprland lock screen with Catppuccin Pink theme
#
# IMPORTANT: On non-NixOS (e.g. Fedora), run: just setup-hyprlock
# Why: https://github.com/nix-community/home-manager/issues/7027
#
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Background - blurred screenshot
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 10
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Input field - for password entry
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(f07ab0)
    inner_color = rgba(00000080)
    font_color = rgb(f5c6e7)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = Password...
    hide_input = false
    check_color = rgb(9ece6a)
    fail_color = rgb(f38ba8)
    fail_text = Invalid password
    capslock_color = rgb(e6ae68)
    position = 0, -100
    halign = center
    valign = center
}

# Time display
label {
    monitor =
    text = cmd[update:1000] date +%H:%M:%S
    text_align = center
    color = rgba(f5c6e7cc)
    font_size = 48
    font_family = JetBrains Mono Nerd Font
    position = 0, 100
    halign = center
    valign = top
}

# Date display
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    text_align = center
    color = rgba(b5bfe299)
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 40
    halign = center
    valign = top
}

# Username/greeting
label {
    monitor =
    text = Hello, $USER
    text_align = center
    color = rgba(f07ab0b3)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, -30
    halign = center
    valign = center
}
