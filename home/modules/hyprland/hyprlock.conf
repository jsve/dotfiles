# hyprlock - Hyprland lock screen with Catppuccin Pink theme
# Fast GPU-accelerated screen lock with custom styling
#
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# Color palette: https://github.com/catppuccin/catppuccin

general {
    no_fade_in = false          # Fade in when locking
    grace = 0                   # Don't delay before requiring password
    disable_loading_bar = false # Show loading indicator
}

# Background - dark Catppuccin Mocha (#1e1e2e)
background {
    monitor = ""  # Apply to all monitors
    path = "screenshot"  # Use screenshot as background (blurred)
    blur_passes = 3  # Number of blur passes for pixelation effect
    blur_size = 10   # Blur radius
    noise = 0.0119   # Add slight noise texture
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Input field - for password entry
input-field {
    monitor = ""
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2         # Ratio to input-field height
    dots_spacing = 0.15     # Ratio to dots size
    dots_center = true
    outer_color = "rgb(240, 122, 176)"  # Catppuccin Pink (#f77ab0)
    inner_color = "rgba(0, 0, 0, 0.5)"  # Semi-transparent black
    font_color = "rgb(245, 198, 231)"   # Light pink text (#f5c6e7)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = "Password..."
    hide_input = false
    check_color = "rgb(158, 206, 106)"  # Catppuccin Green for success
    fail_color = "rgb(243, 139, 168)"   # Catppuccin Red for failure
    fail_text = "Invalid password"
    capslock_color = "rgb(230, 174, 104)" # Catppuccin Yellow for caps lock warning
    position = "0, -100"
    halign = "center"
    valign = "center"
}

# Time display - shows current time
label {
    monitor = ""
    text = "cmd:[[ $(date +%H:%M:%S) ]]"
    text_align = "center"
    color = "rgba(245, 198, 231, 0.8)"   # Light pink with slight transparency
    font_size = 48
    font_family = "JetBrains Mono Nerd Font"
    position = "0, 100"
    halign = "center"
    valign = "top"
}

# Date display - shows date below time
label {
    monitor = ""
    text = "cmd:[[ $(date +'%A, %B %d') ]]"
    text_align = "center"
    color = "rgba(181, 191, 226, 0.6)"   # Light blue-ish gray
    font_size = 18
    font_family = "JetBrains Mono Nerd Font"
    position = "0, 40"
    halign = "center"
    valign = "top"
}

# Username/greeting display - shows username
label {
    monitor = ""
    text = "cmd:[[ echo 'Hello, '$USER ]]"
    text_align = "center"
    color = "rgba(240, 122, 176, 0.7)"   # Pink greeting text
    font_size = 20
    font_family = "JetBrains Mono Nerd Font"
    position = "0, -30"
    halign = "center"
    valign = "center"
}
