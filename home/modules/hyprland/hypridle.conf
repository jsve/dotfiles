# hypridle - Idle daemon for Hyprland
# Monitors user input and triggers events after specified timeout periods
#
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
#
# Triggers:
#   - on-resume: Resume from idle (user activity detected)
#   - before-sleep: System about to suspend
#   - after-sleep: System resumed from suspension

general {
    # Lock the session when receiving dbus lock event (e.g., loginctl lock-session)
    lock_cmd = "loginctl lock-session"

    # Unlock the session when receiving dbus unlock event
    unlock_cmd = "loginctl unlock-session"

    # What to do when the screensaver locks (hyprlock starts)
    on_lock_cmd = "hyprlock"

    # Don't ignore dbus inhibit events from apps (e.g., Firefox video playback)
    # This ensures media players can inhibit screensaver while playing
    ignore_dbus_inhibit = false

    # Don't ignore systemd inhibit events (inhibitors set with systemd-inhibit --what=idle)
    ignore_systemd_inhibit = false

    # Don't ignore Wayland protocol idle inhibitors
    ignore_wayland_inhibit = false
}

# Timeout 1: Lock after 5 minutes of inactivity
# When triggered: hyprlock will start (via on_lock_cmd above)
listener {
    timeout = 300  # 5 minutes in seconds
    on-timeout = "loginctl lock-session"  # Trigger the lock
}

# Timeout 2: Sleep display after 10 minutes of inactivity
# After locking, if still idle for another 5 minutes, sleep the display
listener {
    timeout = 600  # 10 minutes total in seconds
    on-timeout = "hyprctl dispatch dpms off"  # Turn off displays
    on-resume = "hyprctl dispatch dpms on"    # Turn displays back on when activity resumes
}
