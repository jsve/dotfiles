# hypridle - Idle daemon for Hyprland
# Triggers lock screen and display power management on inactivity
#
# Reference: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    # Command to run when D-Bus Lock signal received (e.g., loginctl lock-session, lid close)
    # pidof check prevents double-launch if hyprlock is already running
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before sleep to ensure screen is locked when waking
    before_sleep_cmd = loginctl lock-session

    # Restore display after sleep
    after_sleep_cmd = hyprctl dispatch dpms on

    # Respect app inhibitors (e.g., video playback)
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Lock screen after 5 minutes of inactivity
# Calls hyprlock directly (not via loginctl which causes race condition)
listener {
    timeout = 300
    on-timeout = hyprlock
}

# Turn off display after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 minutes of inactivity (optional - uncomment if desired)
